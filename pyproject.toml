[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docxy"
version = "1.0.0"
description = "Per-page PDF text extraction — native first, OCR only where it's needed."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "harshlaxkar07" }]
keywords = ["pdf", "ocr", "text-extraction", "fastapi", "pymupdf"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
]

dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "pymupdf>=1.23.0,<2.0.0",
    "boto3>=1.34.0,<2.0.0",
    "groq>=0.9.0,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-multipart>=0.0.9,<1.0.0",
    "pillow>=10.0.0,<12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "moto[s3]>=5.0.0,<6.0.0",
]

[project.urls]
Repository = "https://github.com/harshlaxkar07/docxy"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Keep the vendored ui-ux-pro-max-skill checkout out of collection.
testpaths = ["tests"]
norecursedirs = ["ui-ux-pro-max-skill", ".venv", "data", "logs"]
filterwarnings = ["ignore::DeprecationWarning"]
